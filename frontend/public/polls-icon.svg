<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">GayDevs Polls icon</title>
  <desc id="desc">Three neon poll options with the middle option selected, on a transparent background.</desc>

  <defs>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="36%" stop-color="#3B82F6"/>
      <stop offset="68%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>

    <linearGradient id="selected" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>

    <linearGradient id="bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EAFBFF"/>
      <stop offset="55%" stop-color="#C4B5FD"/>
      <stop offset="100%" stop-color="#F5D0FE"/>
    </linearGradient>

    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- option 1 -->
  <g transform="translate(140 225)">
    <circle cx="85" cy="85" r="58" fill="none" stroke="url(#neon)" stroke-width="22" filter="url(#softGlow)"/>
    <rect x="180" y="25" width="560" height="120" rx="60"
          fill="#12152A" fill-opacity="0.86"
          stroke="url(#neon)" stroke-width="14" filter="url(#softGlow)"/>
    <rect x="245" y="67" width="400" height="36" rx="18" fill="url(#bar)" opacity="0.95"/>
  </g>

  <!-- option 2 selected -->
  <g transform="translate(140 430)">
    <circle cx="85" cy="85" r="58" fill="none" stroke="url(#neon)" stroke-width="22" filter="url(#softGlow)"/>
    <circle cx="85" cy="85" r="28" fill="url(#selected)" filter="url(#glow)"/>
    <rect x="180" y="25" width="560" height="120" rx="60"
          fill="url(#selected)" fill-opacity="0.17"
          stroke="url(#neon)" stroke-width="14" filter="url(#softGlow)"/>
    <rect x="245" y="67" width="400" height="36" rx="18" fill="url(#bar)"/>
  </g>

  <!-- option 3 -->
  <g transform="translate(140 635)">
    <circle cx="85" cy="85" r="58" fill="none" stroke="url(#neon)" stroke-width="22" filter="url(#softGlow)"/>
    <rect x="180" y="25" width="560" height="120" rx="60"
          fill="#12152A" fill-opacity="0.86"
          stroke="url(#neon)" stroke-width="14" filter="url(#softGlow)"/>
    <rect x="245" y="67" width="400" height="36" rx="18" fill="url(#bar)" opacity="0.95"/>
  </g>
</svg>
