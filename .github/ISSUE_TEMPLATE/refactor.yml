name: "Refactor"
description: "Mudança interna sem alterar comportamento externo"
type: "Refactor"
body:
  - type: textarea
    id: context
    attributes:
      label: Estrutura atual e motivação
      description: Qual parte interna precisa mudar e por quê?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Mudança interna e comportamento preservado
      description: Delimite a reorganização proposta e os comportamentos externos que devem permanecer iguais.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Critérios de aceite
      description: Como verificar a melhoria interna e a preservação do comportamento externo, incluindo testes de regressão relevantes?
    validations:
      required: true
  - type: markdown
    attributes:
      value: 'Após criar, defina Priority (High, Medium ou Low) no campo nativo. Use blocked by / blocking para dependências. Risk é independente de Priority; Low/Medium podem usar fast-track com aprovação humana e High usa SDD normal. Todos os fluxos mantêm spec.'
