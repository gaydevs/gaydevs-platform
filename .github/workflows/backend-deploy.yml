name: Deploy Backend to DreamHost

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'backend/**'
      - '.github/workflows/backend-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dreamhost-gaydevs-backend-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    env:
      REMOTE_APP: /home/dh_jirb5e/vettoretti.dev/gaydevs/api
      REMOTE_TMP: /home/dh_jirb5e/vettoretti.dev_gaydevs_api_tmp
      REMOTE_ENV: /home/dh_jirb5e/vettoretti.dev_envs/gaydevs_api.env
      REMOTE_PHP: /usr/local/php83/bin/php

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, exif, pcntl, bcmath, gd
          coverage: none
          tools: composer

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-dev --optimize-autoloader

      - name: Verify production scheduler cron
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SFTP_HOST }}
          username: ${{ secrets.SFTP_USERNAME }}
          password: ${{ secrets.SFTP_PASSWORD }}
          port: 22
          script: |
            set -eu
            app='${{ env.REMOTE_APP }}'
            current="$(crontab -l 2>/dev/null || true)"
            # O executável PHP é configurável; o contrato verifica o comando Artisan.
            matches="$(printf '%s\n' "$current" | awk -v app="$app" '!/^[[:space:]]*#/ && index($0, app) && $0 ~ /(^|[[:space:];&|])artisan[[:space:]]+schedule:run([[:space:]]|$)/ { print }')"
            count="$(printf '%s\n' "$matches" | awk 'NF { count += 1 } END { print count + 0 }')"

            if [ "$count" -eq 0 ]; then
              echo 'Cron do Laravel não encontrado. Execute o workflow Provision Backend Scheduler e reexecute este deploy.' >&2
              exit 1
            fi

            if [ "$count" -gt 1 ]; then
              echo 'Há múltiplas entradas do scheduler para o backend; remova a duplicidade manualmente e reexecute este deploy.' >&2
              exit 1
            fi

            if ! printf '%s\n' "$matches" | awk 'NF >= 6 && $1 == "*" && $2 == "*" && $3 == "*" && $4 == "*" && $5 == "*" { found = 1 } END { exit(found ? 0 : 1) }'; then
              echo 'Cron do Laravel encontrado, mas não está configurado para cada minuto. Corrija-o no workflow Provision Backend Scheduler e reexecute este deploy.' >&2
              exit 1
            fi

            echo 'Cron do Laravel configurado para cada minuto.'

      - name: Create temp directory on server
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SFTP_HOST }}
          username: ${{ secrets.SFTP_USERNAME }}
          password: ${{ secrets.SFTP_PASSWORD }}
          port: 22
          script: |
            rm -rf "${{ env.REMOTE_TMP }}"
            mkdir -p "${{ env.REMOTE_TMP }}"

      - name: Deploy Laravel via SFTP
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.SFTP_HOST }}
          username: ${{ secrets.SFTP_USERNAME }}
          password: ${{ secrets.SFTP_PASSWORD }}
          port: 22
          source: "backend/"
          target: "${{ env.REMOTE_TMP }}"
          strip_components: 1

      - name: Swap temp into place, migrate and cache
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SFTP_HOST }}
          username: ${{ secrets.SFTP_USERNAME }}
          password: ${{ secrets.SFTP_PASSWORD }}
          port: 22
          script: |
            set -e
            cd "${{ env.REMOTE_TMP }}"

            rm -rf .env* README* LICENSE* *.md tests docs Dockerfile* docker-compose.yml
            rm -f storage/logs/*.log

            cp "${{ env.REMOTE_ENV }}" .env

            # O comando `php` padrão do host pode apontar para uma versão antiga.
            # Falhe antes da troca se o runtime exigido pelo Composer não estiver disponível.
            "${{ env.REMOTE_PHP }}" --version

            # O app inteiro vive em /gaydevs/api; o .htaccess da raiz joga todo
            # pedido para public/, então nada fora dela é servido
            printf '%s\n' \
              'Options -Indexes' \
              'RewriteEngine On' \
              'RewriteRule ^(.*)$ public/$1 [L]' > .htaccess

            # Valide o release antes de trocar o diretório ativo.
            "${{ env.REMOTE_PHP }}" artisan migrate --force
            "${{ env.REMOTE_PHP }}" artisan config:cache
            "${{ env.REMOTE_PHP }}" artisan route:cache
            "${{ env.REMOTE_PHP }}" artisan view:cache

            mkdir -p "$(dirname "${{ env.REMOTE_APP }}")"
            rm -rf "${{ env.REMOTE_APP }}_old"
            mv "${{ env.REMOTE_APP }}" "${{ env.REMOTE_APP }}_old" 2>/dev/null || true
            mv "${{ env.REMOTE_TMP }}" "${{ env.REMOTE_APP }}"

            rm -rf "${{ env.REMOTE_APP }}_old"
