name: SDD sandbox tests
on:
  pull_request:
    branches: [develop]
    paths:
      - 'scripts/sdd/**'
      - '.specify/**'
      - '.github/sdd.json'
      - '.github/workflows/sdd-reconcile.yml'
      - '.github/workflows/sdd-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24.15.0'
      - run: |
          command -v pwsh
          node scripts/sdd/test.mjs
