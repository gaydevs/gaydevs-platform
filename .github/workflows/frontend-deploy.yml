name: Deploy to DreamHost

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dreamhost-gaydevs-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    env:
      REMOTE_ROOT: /home/dh_jirb5e/vettoretti.dev/gaydevs
      REMOTE_APP: /home/dh_jirb5e/vettoretti.dev/gaydevs/platform
      REMOTE_TMP: /home/dh_jirb5e/vettoretti.dev_gaydevs_platform_tmp

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Prepare temp directory on server
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SFTP_HOST }}
          username: ${{ secrets.SFTP_USERNAME }}
          password: ${{ secrets.SFTP_PASSWORD }}
          port: 22
          script: |
            rm -rf "${{ env.REMOTE_TMP }}"
            mkdir -p "${{ env.REMOTE_TMP }}"

      - name: Upload static files via SFTP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SFTP_HOST }}
          username: ${{ secrets.SFTP_USERNAME }}
          password: ${{ secrets.SFTP_PASSWORD }}
          port: 22
          source: "frontend/dist/"
          target: "${{ env.REMOTE_TMP }}"
          strip_components: 2

      - name: Swap temp into place and clean up
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SFTP_HOST }}
          username: ${{ secrets.SFTP_USERNAME }}
          password: ${{ secrets.SFTP_PASSWORD }}
          port: 22
          script: |
            mkdir -p "${{ env.REMOTE_ROOT }}"
            # Remove restos do layout antigo (frontend direto em /gaydevs/)
            find "${{ env.REMOTE_ROOT }}" -mindepth 1 -maxdepth 1 ! -name platform ! -name api ! -name .htaccess -exec rm -rf {} +
            printf 'RedirectMatch 302 ^/gaydevs/?$ /gaydevs/platform/\n' > "${{ env.REMOTE_ROOT }}/.htaccess"
            rm -rf "${{ env.REMOTE_APP }}_old"
            mv "${{ env.REMOTE_APP }}" "${{ env.REMOTE_APP }}_old" 2>/dev/null || true
            mv "${{ env.REMOTE_TMP }}" "${{ env.REMOTE_APP }}"
            rm -rf "${{ env.REMOTE_APP }}_old"
            rm -rf "${{ env.REMOTE_TMP }}"
