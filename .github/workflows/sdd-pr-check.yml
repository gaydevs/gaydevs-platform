name: SDD PR contract

on:
  pull_request:
    branches:
      - develop
    types:
      - opened
      - edited
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  contract:
    name: Validate SDD PR contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout base workflow code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.15.0'

      - name: Validate PR contract
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f scripts/sdd/pr-check.mjs ]; then
            echo "::notice::SDD PR check script is not available in the base branch yet; bootstrap PR must be validated manually."
            exit 0
          fi
          node scripts/sdd/pr-check.mjs "${{ github.event.pull_request.number }}"
