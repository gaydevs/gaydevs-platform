name: SDD PR contract

on:
  pull_request:
    branches:
      - develop
    types:
      - opened
      - edited
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  contract:
    name: Validate SDD PR contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout base workflow code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate PR contract
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/sdd/pr-check.mjs "${{ github.event.pull_request.number }}"
